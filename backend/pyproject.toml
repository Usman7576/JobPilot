[project]
name = "jobpilot-api"
version = "0.1.0"
description = "JobPilot AI backend: FastAPI + Celery"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.32",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "flower>=2.0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.4",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "slowapi>=0.1.9",
  "google-genai>=2.33.0",
  "pdfplumber>=0.11.10",
  "python-docx>=1.2.0",
  "fastembed>=0.9.1",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.3",
  "python-jobspy>=1.4.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "ASYNC240", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
# Celery's task decorator is untyped.
module = "app.tasks.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

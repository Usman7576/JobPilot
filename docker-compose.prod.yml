# Production on one VM (e.g. Oracle Cloud Always Free, ARM): everything except the website,
# which runs on Vercel. HTTPS comes from a Cloudflare Tunnel, so no ports are opened.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See docs/DEPLOY.md for the full walkthrough.
name: jobpilot-prod

x-backend: &backend
  image: jobpilot-backend:prod
  build:
    context: ./backend
    args:
      INSTALL_DEV: "false"
  env_file:
    - path: .env.production
      required: true
  environment:
    ENV: production
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobpilot}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    LOCAL_STORAGE_PATH: /data/uploads
    MODEL_CACHE_DIR: /data/models
    LOG_JSON: "true"
  volumes:
    - uploads:/data/uploads
    - models:/data/models
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./data/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
        --proxy-headers --forwarded-allow-ips '*'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *backend
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --concurrency=2
      - -Q
      - default,scrape,llm,email,sync
      - -l
      - info

  # Exactly one scheduler: daily searches, the hourly account purge, heartbeats.
  beat:
    <<: *backend
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - beat
      - -l
      - info
      - -s
      - /data/uploads/.celerybeat-schedule

  # HTTPS without opening ports: the tunnel connects out to Cloudflare, which serves
  # https://api.<your-domain> and forwards to http://api:8000 (set in the Cloudflare dashboard).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
  models:
